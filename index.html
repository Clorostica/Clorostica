    <meta name="theme-color" content="#0f0c17" />
    <script>
      // Apply the saved theme (or the system one) before first paint
      (function () {
        var theme;
        try { theme = localStorage.getItem("clorostica-theme"); } catch (e) {}
        if (!theme) theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
