<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Gobento: Turns group-chat plans into one shareable link">
  <title>Gobento: Turns group-chat plans into one shareable link</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .path { font-size: 21px; fill: #9A8FB0; }
    .kind { font-size: 18px; fill: #9A8FB0; letter-spacing: 1px; }
    .title { font-size: 64px; font-weight: 800; letter-spacing: -2px; fill: #EE5DA6; }
    .tag { font-size: 25px; fill: #F6F1FA; }
    .stack { font-size: 17px; fill: #9A8FB0; }
    .hex { font-size: 17px; fill: #F6F1FA; }
    .caret { fill: #EE5DA6; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .sw { animation: float 4s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .caret, .sw { animation: none; } }
  </style>
  <rect width="1200" height="240" rx="26" fill="#17102B"/>
  <rect x="0.5" y="0.5" width="1199" height="239" rx="25.5" fill="none" stroke="#2C2245"/>
  <line x1="930" y1="34" x2="930" y2="206" stroke="#2C2245" stroke-width="2"/>

  <text class="mono path" x="64" y="62">~/projects/gobento</text>
  <rect class="caret" x="297" y="45" width="11" height="22" rx="1"/>
  <text class="mono kind" x="900" y="62" text-anchor="end">02 · social app</text>

  <text class="title" x="60" y="134">Gobento</text>
  <text class="tag" x="64" y="176">Turns group-chat plans into one shareable link</text>
  <text class="mono stack" x="64" y="210">react · typescript · hono · d1 · stripe</text>

