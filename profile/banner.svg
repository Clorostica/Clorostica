<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Claudia Orostica, Design Engineer">
  <title>Claudia Orostica, Design Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf2f8"/>
      <stop offset="0.55" stop-color="#f5ecff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="card">
      <rect width="1200" height="340" rx="28"/>
    </clipPath>
    <path id="spark" d="M0 -12 C1.5 -3 3 -1.5 12 0 C3 1.5 1.5 3 0 12 C-1.5 3 -3 1.5 -12 0 C-3 -1.5 -1.5 -3 0 -12 Z"/>
  </defs>

  <style>
    .blob { transform-box: fill-box; transform-origin: center; animation: drift 14s ease-in-out infinite alternate; }
    .b2 { animation-duration: 18s; animation-delay: -6s; }
    .b3 { animation-duration: 16s; animation-delay: -3s; }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(60px, -25px) scale(1.12); }
      100% { transform: translate(-40px, 20px) scale(0.95); }
    }

    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite; }
    .s2 { animation-delay: -0.8s; } .s3 { animation-delay: -1.6s; } .s4 { animation-delay: -2.4s; } .s5 { animation-delay: -1.2s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.5) rotate(0deg); }
      50%      { opacity: 1;    transform: scale(1) rotate(45deg); }
    }

    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .hi   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 20px; fill: #a855f7; letter-spacing: 1px; }
    .name { font-size: 76px; font-weight: 800; letter-spacing: -2px; }

    .word { font-size: 30px; font-weight: 600; fill: #4c1d95; opacity: 0; animation: cycle 12s infinite; }
    .w2 { animation-delay: 3s; } .w3 { animation-delay: 6s; } .w4 { animation-delay: 9s; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(14px); }
      4%   { opacity: 1; transform: translateY(0); }
      21%  { opacity: 1; transform: translateY(0); }
      25%  { opacity: 0; transform: translateY(-14px); }
      100% { opacity: 0; transform: translateY(-14px); }
    }

    .cursor { fill: #db2777; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .blob, .spark, .cursor { animation: none; }
      .word { animation: none; }
      .w1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.75">
      <circle class="blob" cx="980" cy="70" r="140" fill="#f9a8d4"/>
      <circle class="blob b2" cx="1120" cy="280" r="120" fill="#c4b5fd"/>
      <circle class="blob b3" cx="760" cy="300" r="110" fill="#fbcfe8"/>
    </g>
  </g>

  <g transform="translate(1000 105)"><use href="#spark" class="spark" fill="#ffffff"/></g>
  <g transform="translate(1105 200) scale(1.3)"><use href="#spark" class="spark s2" fill="#ffffff"/></g>
  <g transform="translate(880 235) scale(0.9)"><use href="#spark" class="spark s3" fill="#db2777"/></g>
  <g transform="translate(1135 70) scale(0.7)"><use href="#spark" class="spark s4" fill="#a855f7"/></g>
  <g transform="translate(820 125) scale(1.1)"><use href="#spark" class="spark s5" fill="#ec4899"/></g>
  <g transform="translate(965 285) scale(0.8)"><use href="#spark" class="spark s3" fill="#ffffff"/></g>

  <text class="hi" x="80" y="108">hi, I'm</text>
  <text class="name" x="76" y="186" fill="url(#name)">Claudia Orostica</text>

  <g transform="translate(80 248)">
    <text class="word w1" x="0" y="0">Design Engineer</text>
    <text class="word w2" x="0" y="0">Product-focused Frontend</text>
    <text class="word w3" x="0" y="0">React · TypeScript · Figma</text>
    <text class="word w4" x="0" y="0">Based in Berlin</text>
  </g>
  <rect class="cursor" x="80" y="262" width="36" height="4" rx="2"/>
</svg>
